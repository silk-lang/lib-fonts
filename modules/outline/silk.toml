[package]
name = "font-outline"
description = "Glyph outlines (glyf, gvar, CFF, CFF2) drawn into any path sink or a vector path"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["outline", "vector_path"]

[dependencies]
read_fonts = { path = "../parse", package = "font-parse" }
font_types = { path = "../types", package = "font-types" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3770cb41beaf709272548863f5b020f476765f", path = "modules/vector", package = "graphics-vector" }
