[package]
name = "font-outline"
description = "Glyph outlines (glyf, gvar, CFF, CFF2) drawn into any path sink or a vector path"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["outline", "vector_path"]

[dependencies]
read_fonts = { path = "../parse", package = "font-parse" }
font_types = { path = "../types", package = "font-types" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/vector", package = "graphics-vector" }
