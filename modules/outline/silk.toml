[package]
name = "font-outline"
description = "Glyph outlines (glyf, gvar, CFF, CFF2) drawn into any path sink or a vector path"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["outline", "vector_path"]

[dependencies]
read_fonts = { path = "../parse", package = "font-parse" }
font_types = { path = "../types", package = "font-types" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "4a90de327acd6f62d060019ab49dba5490262f69", path = "modules/vector", package = "graphics-vector" }
