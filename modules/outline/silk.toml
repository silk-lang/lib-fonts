[package]
name = "font-outline"
description = "Glyph outlines (glyf, gvar, CFF, CFF2) drawn into any path sink or a vector path"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "library"
exports = ["outline", "vector_path"]

[dependencies]
read_fonts = { path = "../parse", package = "font-parse" }
font_types = { path = "../types", package = "font-types" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "27a7df29ac7dec7e2c343ea3845a720e74d6db05", path = "modules/vector", package = "graphics-vector" }
